<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:#07120f;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    width:350px;
    padding:25px;
    border-radius:15px;
    background:#0f1f1a;
    border:1px solid #22c55e;
}
input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}
button{
    width:100%;
    padding:10px;
    background:#22c55e;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
#panel{
    display:none;
}
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Admin Kirish</h2>

    <input type="text" id="login" placeholder="Login">
    <input type="password" id="password" placeholder="Parol">

    <button onclick="login()">Kirish</button>
</div>

<div class="box" id="panel">
    <h2>Admin Panel</h2>

    <p>👥 Jami foydalanuvchilar: <span id="users">0</span></p>
    <p>🏆 Sertifikat olganlar: <span id="certs">0</span></p>
    <p>📈 O'rtacha natija: <span id="avg">0%</span></p>

    <button onclick="logout()">Chiqish</button>
</div>

<script>
const ADMIN_LOGIN = "admin";
const ADMIN_PASSWORD = "12345";

function login(){
    let l = document.getElementById("login").value;
    let p = document.getElementById("password").value;

    if(l===ADMIN_LOGIN && p===ADMIN_PASSWORD){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("panel").style.display="block";
    }else{
        alert("Login yoki parol xato!");
    }
}

function logout(){
    location.reload();
}
</script>

</body>
</html>
